<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Wyślij wiadomość</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d1f23; --muted:#5b6070; --line:#dfe2e8; --btn:#2f6fec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141517; --card:#1f2124; --text:#eceef2; --muted:#9aa0ad; --line:#33363c; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,Segoe UI,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:19px; margin:4px 0 12px; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; white-space:pre-wrap; font:inherit; margin:0 0 14px; }
  .btn { display:block; width:100%; box-sizing:border-box; text-align:center; background:var(--btn); color:#fff; border:0; border-radius:10px;
         padding:14px; font-size:17px; text-decoration:none; margin-bottom:10px; cursor:pointer; }
  .btn.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Brak danych wiadomości w linku.</p></div>
<script>
// Dane (typ, odbiorca, treść) są w części adresu po "#" – przeglądarka nie wysyła jej do serwera.
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var type = p.get('t'), to = p.get('n') || '', body = p.get('b') || '';
  if (!type || !to) return;
  history.replaceState(null, '', location.pathname); // usuń dane z paska adresu i historii

  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var app = document.getElementById('app');
  var esc = function (s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };

  function copy(btn) {
    var done = function () { if (btn) { btn.textContent = 'Skopiowano ✓'; } };
    if (navigator.clipboard) return navigator.clipboard.writeText(body).then(done, fallback);
    fallback();
    function fallback() {
      var t = document.createElement('textarea'); t.value = body; document.body.appendChild(t);
      t.select(); document.execCommand('copy'); t.remove(); done();
    }
  }

  if (type === 'sms') {
    var href = 'sms:+' + to + (ios ? '&' : '?') + 'body=' + encodeURIComponent(body);
    app.innerHTML = '<h1>SMS do +' + esc(to) + '</h1><pre>' + esc(body) + '</pre>' +
      '<a class="btn" id="go" href="' + href + '">Otwórz SMS</a>' +
      '<button class="btn ghost" id="cp">Kopiuj tekst</button>';
    document.getElementById('cp').onclick = function () { copy(this); };
    location.href = href; // od razu otwiera Wiadomości z gotową treścią
  } else if (type === 'm') {
    var url = /^\d+$/.test(to) ? 'https://m.me/' + to : 'https://m.me/' + encodeURIComponent(to);
    app.innerHTML = '<h1>Messenger</h1><pre>' + esc(body) + '</pre>' +
      '<button class="btn" id="go">Kopiuj i otwórz Messengera</button>' +
      '<p class="muted">W Messengerze przytrzymaj pole wiadomości i wybierz „Wklej”.</p>';
    document.getElementById('go').onclick = function () {
      var b = this;
      Promise.resolve(copy(b)).then(function () { location.href = url; });
    };
  }
})();
</script>
</body>
</html>
